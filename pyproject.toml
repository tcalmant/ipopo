[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pelix"]

[project]
name = "iPOPO"
version = "3.2.2"
authors = [
  { name = "Thomas Calmant", email = "thomas.calmant+github@gmail.com" },
]
requires-python = ">=3.10"
description = "A service-oriented component model framework"
readme = "README.rst"
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
  "Typing :: Typed",
]
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = ["jsonrpclib-pelix>=0.4.3,<1.3.0"]

[project.urls]
Homepage = "https://ipopo.readthedocs.io/"
Documentation = "https://ipopo.readthedocs.io/"
Issues = "http://github.com/tcalmant/ipopo/issues"
Source = "http://github.com/tcalmant/ipopo/"

[project.optional-dependencies]
aiohttp = ["aiohttp>=3.13.5,<3.15.0"]
etcd2 = ["python-etcd~=0.4.5", "osgiservicebridge~=1.5.9"]
MQTT = ["paho-mqtt~=2.1.0"]
Redis = ["redis>=7.4,<8.2"]
RSA = ["osgiservicebridge~=1.5.9", "grpcio>=1.80,<1.84", "grpcio-tools>=1.80,<1.84"]
XMPP = [
  "slixmpp~=1.12.0; python_version <= '3.10'",
  "slixmpp~=1.15.0; python_version > '3.10'",
]
zeroconf = ["zeroconf>=0.148,<0.151"]
ZooKeeper = ["kazoo~=2.11.0"]
yaml = ["pyyaml~=6.0.3"]

[dependency-groups]
dev = [
  "pytest>=9.0.3",
  "coverage>=7.6",
  # Enables coverage in the frameworks started in subprocesses by the tests
  "coverage-enable-subprocess>=1.0",
  "coveralls>=4.0",
  # Linter, formatter and type checker: the same ones the CI enforces
  "ruff>=0.16.2",
  "ty>=0.0.69",
]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
extend-select = ["I"]
ignore = [
  # Let all modules have their shebang
  "EXE001"
]

[tool.ty.rules]
invalid-type-form = "ignore"
unsupported-base = "ignore"
unused-type-ignore-comment = "ignore"

[tool.ty.src]
exclude = [
  "**/*_pb2.py",
  "**/*_pb2.pyi",
  "**/*_pb2_grpc.py",
  "**/*_pb2_grpc.pyi"
  
]
