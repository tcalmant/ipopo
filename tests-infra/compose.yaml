services:
  etcd3:
    image: bitnamilegacy/etcd
    environment:
      - ALLOW_NONE_AUTHENTICATION=yes
    ports:
      - "2379:2379"

  mqtt-broker:
    image: eclipse-mosquitto
    # Secrets made by mqtt/prepare.sh. Mosquitto wants its password file to be
    # private and owned by its user
    env_file: ./mqtt/.env
    command: >-
      sh -c "rm -f /mosquitto/data/passwd && mosquitto_passwd -c -b /mosquitto/data/passwd \"$$MQTT_TEST_USERNAME\" \"$$MQTT_TEST_PASSWORD\"
      && chown mosquitto:mosquitto /mosquitto/data/passwd && chmod 600 /mosquitto/data/passwd
      && exec mosquitto -c /mosquitto/config/mosquitto.conf"
    volumes:
      - ./mqtt/mosquitto.conf:/mosquitto/config/mosquitto.conf:z
      - ./mqtt/certs:/mosquitto/certs:ro,z
    ports:
      - "1883:1883"
      - "1884:1884"
      - "8883:8883"
      - "8884:8884"

  redis:
    image: redis
    ports:
      - "6379:6379"

  xmpp:
    image: ejabberd/ecs:latest
    ports:
      - "5222:5222"
    environment:
      - ERL_OPTS=-noshell
    volumes:
      - ./xmpp/register_users.sh:/opt/register_users.sh:ro,z
    # post_start:
    #   - command: /bin/sh /opt/register_users.sh

  zookeeper:
    image: zookeeper
    ports:
      - "2181:2181"
