name: Pytest file matrix

on:
  workflow_call:
    inputs:
      python-version:
        required: true
        type: string

jobs:
  collect:
    runs-on: ubuntu-latest
    outputs:
      files: ${{ steps.collect.outputs.files }}
    steps:
      - uses: actions/checkout@v7

      - name: Install uv and Python ${{ inputs.python-version }}
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          python-version: ${{ inputs.python-version }}

      - name: Install dependencies
        run: uv sync --python "${{ inputs.python-version }}" --all-extras --locked

      - name: Start test infrastructure
        run: |
          docker compose -f tests-infra/compose.yaml up -d
          sh ./tests-infra/xmpp/docker_register_users.sh

      - name: List test files
        id: collect
        run: |
          FILES=$(uv run --no-sync python -m pytest tests --collect-only -q \
            | grep '::' | cut -d: -f1 | sort -u)
          JSON=$(printf '%s\n' "$FILES" | jq -R -c '
            select(length > 0) | {
              file: .,
              needs_infra: (startswith("tests/remote/") or startswith("tests/rsa/") or startswith("tests/shell/"))
            }' | jq -s -c '.')
          echo "files=$JSON" >> "$GITHUB_OUTPUT"

  test:
    needs: collect
    timeout-minutes: 15
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.collect.outputs.files) }}
    steps:
      - uses: actions/checkout@v7

      - name: Use JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install uv and Python ${{ inputs.python-version }}
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          python-version: ${{ inputs.python-version }}

      - name: Install dependencies
        run: uv sync --python "${{ inputs.python-version }}" --all-extras --locked

      - name: Start test infrastructure
        if: ${{ matrix.needs_infra }}
        run: |
          docker compose -f tests-infra/compose.yaml up -d
          sh ./tests-infra/xmpp/docker_register_users.sh

      - name: Run unit tests
        run: |
          uv run --no-sync coverage run -m pytest "${{ matrix.file }}"
          uv run --no-sync coverage combine
          uv run --no-sync coverage xml -o coverage.xml

      - name: Coveralls Parallel
        uses: coverallsapp/github-action@v2
        continue-on-error: true
        with:
          flag-name: python-${{ inputs.python-version }}-${{ matrix.file }}
          parallel: true
          file: coverage.xml
          format: cobertura
