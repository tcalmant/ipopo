name: CI Build

on:
  push:
    branches: [v1, v2, v3, ci-test]
  pull_request:
    branches: [v1, v2, v3]
  workflow_dispatch:

jobs:
  test:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]

    steps:
      - uses: actions/checkout@v7

      - name: Use JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install uv and Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --python "${{ matrix.python-version }}" --all-extras --locked

      - name: Start test infrastructure
        run: |
          docker compose -f tests-infra/compose.yaml up -d
          sh ./tests-infra/xmpp/docker_register_users.sh

      - name: Run unit tests
        run: |
          uv run --no-sync coverage run -m pytest tests
          uv run --no-sync coverage combine
          uv run --no-sync coverage xml -o coverage.xml

      - name: Coveralls Parallel
        uses: coverallsapp/github-action@v2
        continue-on-error: true
        with:
          flag-name: python-${{ matrix.python-version }}
          parallel: true
          file: coverage.xml
          format: cobertura

  finish:
    needs: test
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
    - name: Coveralls Finished
      uses: coverallsapp/github-action@v2
      continue-on-error: true
      with:
        parallel-finished: true
