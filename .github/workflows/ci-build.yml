name: CI Build

on:
  push:
    branches: [v1, v2, v3, ci-test]
  pull_request:
    branches: [v1, v2, v3]
  workflow_dispatch:

jobs:
  lint:
    timeout-minutes: 10
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # Lint against python 3.14, as some dependencies are not available
      # for 3.15 yet
      - name: Install uv and Python
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          python-version: "3.14"

      - name: Install dependencies
        # All the extras so that `ty` sees the optional imports
        run: uv sync --all-extras --locked

      - name: Check code style
        run: uv run --no-sync ruff check .

      - name: Check formatting
        run: uv run --no-sync ruff format --check .

      - name: Check types
        # Don't check samples as they depend on other dependencies
        run: uv run --no-sync ty check pelix tests

  test:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]

    steps:
      - uses: actions/checkout@v7

      - name: Use JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install uv and Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        # RSA (grpcio) has no prebuilt wheel for Python 3.15 yet: building it
        # from source stalls on GitHub Actions, so skip it on 3.15 until
        # upstream publishes cp315 wheels.
        run: |
          if [ "${{ matrix.python-version }}" = "3.15" ]; then
            uv sync --python "${{ matrix.python-version }}" --all-extras --no-extra RSA --locked
          else
            uv sync --python "${{ matrix.python-version }}" --all-extras --locked
          fi

      - name: Start test infrastructure
        run: |
          docker compose -f tests-infra/compose.yaml up -d
          sh ./tests-infra/xmpp/docker_register_users.sh

      - name: Run unit tests
        run: |
          uv run --no-sync coverage run -m pytest tests
          uv run --no-sync coverage combine
          uv run --no-sync coverage xml -o coverage.xml

      - name: Coveralls Parallel
        uses: coverallsapp/github-action@v2
        continue-on-error: true
        with:
          flag-name: python-${{ matrix.python-version }}
          parallel: true
          file: coverage.xml
          format: cobertura

  finish:
    needs: test
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
    - name: Coveralls Finished
      uses: coverallsapp/github-action@v2
      continue-on-error: true
      with:
        parallel-finished: true
